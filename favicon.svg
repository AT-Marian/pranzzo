<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa31a"/>
      <stop offset="50%" stop-color="#ff6817"/>
      <stop offset="100%" stop-color="#d94400"/>
    </linearGradient>

    <!-- Main P Gradient -->
    <linearGradient id="pGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffbb33"/>
      <stop offset="40%" stop-color="#ff7505"/>
      <stop offset="85%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#cc3d00"/>
    </linearGradient>

    <!-- 3D Ribbon Swoop Gradient -->
    <linearGradient id="swoopGrad" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="60%" stop-color="#ff5e00"/>
      <stop offset="100%" stop-color="#b83200"/>
    </linearGradient>

    <!-- QR Code Gradient -->
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc94d"/>
      <stop offset="50%" stop-color="#ff8008"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for P -->
    <filter id="pGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. FIRST CIRCLE: Deep black in the middle with glowing orange border -->
  <circle cx="256" cy="256" r="240" fill="#080c0a" stroke="url(#rimGrad)" stroke-width="22"/>
  
  <!-- Subtle inner rim reflection -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#ff7a00" stroke-width="2" stroke-opacity="0.25"/>

  <!-- 2. BRAND LETTER 'P' with integrated counter loop -->
  <g filter="url(#pGlow)">
    <!-- Main P Silhouette with counter cutout using evenodd rule -->
    <path fill-rule="evenodd" fill="url(#pGrad)" d="
      M 148 100
      C 148 94, 154 90, 160 90
      L 292 90
      C 368 90, 418 136, 418 218
      C 418 300, 368 344, 290 344
      L 242 344
      L 242 410
      C 242 416, 238 422, 230 422
      L 160 422
      C 152 422, 148 416, 148 410
      Z
      M 226 156
      L 290 156
      C 334 156, 356 182, 356 218
      C 356 254, 334 278, 290 278
      L 226 278
      Z
    "/>

    <!-- Bottom Ribbon Swoop curve (giving the signature Pranzzo dimensional fold) -->
    <path d="
      M 148 350
      C 148 350, 178 285, 244 285
      L 290 285
      C 328 285, 354 260, 356 226
      C 346 268, 318 290, 280 290
      L 236 290
      C 185 290, 156 345, 148 412
      Z
    " fill="url(#swoopGrad)" opacity="0.95"/>
  </g>

  <!-- 3. QR CODE IN THE MIDDLE (replacing the fork inside the loop of the P) -->
  <!-- Solid deep black background backing for maximum contrast -->
  <rect x="220" y="152" width="138" height="130" rx="8" fill="#080c0a"/>

  <g transform="translate(230, 160)">
    <!-- Top-Left Finder Pattern -->
    <rect x="0" y="0" width="34" height="34" rx="6" fill="none" stroke="url(#qrGrad)" stroke-width="5.5"/>
    <rect x="9" y="9" width="16" height="16" rx="3" fill="url(#qrGrad)"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="76" y="0" width="34" height="34" rx="6" fill="none" stroke="url(#qrGrad)" stroke-width="5.5"/>
    <rect x="85" y="9" width="16" height="16" rx="3" fill="url(#qrGrad)"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="0" y="76" width="34" height="34" rx="6" fill="none" stroke="url(#qrGrad)" stroke-width="5.5"/>
    <rect x="9" y="85" width="16" height="16" rx="3" fill="url(#qrGrad)"/>

    <!-- QR Data Modules / Matrix Points -->
    <!-- Top row between finders -->
    <rect x="44" y="3" width="9" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="58" y="3" width="9" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="44" y="16" width="9" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="58" y="16" width="9" height="18" rx="2" fill="url(#qrGrad)"/>

    <!-- Middle timing / data strip -->
    <rect x="3" y="44" width="9" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="17" y="44" width="11" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="33" y="44" width="9" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="3" y="58" width="9" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="19" y="58" width="9" height="9" rx="2" fill="url(#qrGrad)"/>

    <!-- Center QR cluster -->
    <rect x="44" y="46" width="9" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="57" y="46" width="11" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="44" y="60" width="22" height="9" rx="2" fill="url(#qrGrad)"/>

    <!-- Right-hand data modules -->
    <rect x="76" y="44" width="12" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="95" y="44" width="15" height="11" rx="2" fill="url(#qrGrad)"/>
    <rect x="76" y="60" width="10" height="10" rx="2" fill="url(#qrGrad)"/>
    <rect x="92" y="60" width="18" height="9" rx="2" fill="url(#qrGrad)"/>

    <!-- Bottom data modules -->
    <rect x="76" y="78" width="16" height="10" rx="2" fill="url(#qrGrad)"/>
    <rect x="98" y="78" width="12" height="25" rx="2" fill="url(#qrGrad)"/>
    <rect x="76" y="94" width="14" height="9" rx="2" fill="url(#qrGrad)"/>
    <rect x="44" y="78" width="10" height="10" rx="2" fill="url(#qrGrad)"/>
    <rect x="59" y="85" width="9" height="18" rx="2" fill="url(#qrGrad)"/>
    <rect x="44" y="94" width="10" height="9" rx="2" fill="url(#qrGrad)"/>
  </g>
</svg>
